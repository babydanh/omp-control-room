        type:
          const: usageStats
        requestId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        overall:
          $ref: '#/components/schemas/UsageStatsTotals'
        byModel:
          type: array
          items:
            $ref: '#/components/schemas/UsageStatsModelRow'
        byFolder:
          type: array
          items:
            $ref: '#/components/schemas/UsageStatsFolderRow'
        byAgentType:
          type: array
          items:
            $ref: '#/components/schemas/UsageStatsAgentRow'
        timeSeries:
          type: array
          items:
            $ref: '#/components/schemas/UsageStatsTimePoint'
        modelPerformanceSeries:
          type: array
          items:
            $ref: '#/components/schemas/UsageStatsModelPerformancePoint'
        costSeries:
          type: array
          items:
            $ref: '#/components/schemas/UsageStatsCostPoint'

    TerminalAttachedMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, sessionId, runEpoch, leaseId, cols, rows]
      properties:
        type:
          const: terminalAttached
        requestId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        runEpoch:
          type: integer
          minimum: 0
        leaseId:
          type: string
          format: uuid
          description: Controller lease; the last attach for a session wins.
        cols:
          type: integer
          minimum: 1
        rows:
          type: integer
          minimum: 1

    TerminalSnapshotMessage:
      type: object
      additionalProperties: false
      required: [type, sessionId, runEpoch, seq, data]
      properties:
        type:
          const: terminalSnapshot
        sessionId:
          type: string
          format: uuid
        runEpoch:
          type: integer
          minimum: 0
        seq:
          type: integer
          minimum: 0
        data:
          type: string
          description: Base64 serialized framebuffer, replayed on reattach.

    TerminalDataMessage:
      type: object
      additionalProperties: false
      required: [type, sessionId, runEpoch, seq, data]
      properties:
        type:
          const: terminalData
        sessionId:
          type: string
          format: uuid
        runEpoch:
          type: integer
          minimum: 0
        seq:
          type: integer
          minimum: 0
        data:
          type: string
          description: Base64-encoded bytes exactly as the PTY produced them.

    TerminalClosedMessage:
      type: object
      additionalProperties: false
      required: [type, sessionId, runEpoch, seq, reason]
      properties:
        type:
          const: terminalClosed
        sessionId:
          type: string
          format: uuid
        runEpoch:
          type: integer
          minimum: 0
        seq:
          type: integer
          minimum: 0
        reason:
          type: string
    # ── Project tree: privileged project, checkout and session protocol ─
