          type: string


    # ── Company shared shapes ───────────────────────────────────

    CompanyModelCatalogEntry:
      type: object
      additionalProperties: false
      required: [id, provider, model, thinking, acceptsImages, credentialsConfigured]
      properties:
        id:
          type: string
          description: '`provider/model`, the identifier a dispatch uses.'
        provider:
          type: string
        model:
          type: string
        thinking:
          type: array
          items:
            type: string
          description: Reasoning levels this model actually accepts.
        acceptsImages:
          type: boolean
          description: |
            True only when the runtime verified native image input for this
            model. Never inferred from the model name: an image attachment is
            delivered only when this flag is true.
        credentialsConfigured:
          type: boolean
          description: Whether a usable credential exists, without exposing it.

    CompanyFileEntry:
      type: object
      additionalProperties: false
      required: [name, path, kind]
      properties:
        name:
          type: string
        path:
          type: string
          description: Workspace-relative path with forward slashes.
        kind:
          type: string
          enum: [file, directory]
        sizeBytes:
          type: integer
          minimum: 0
        modifiedAt:
          type: string
          format: date-time

    CompanyFileContent:
      type: object
      additionalProperties: false
      required: [path, totalBytes, offset, encoding, truncated]
      properties:
        path:
          type: string
        totalBytes:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        encoding:
          type: string
          enum: [utf8, base64]
        text:
          type: string
        dataBase64:
          type: string
        mediaType:
          type: string
        truncated:
          type: boolean

    # ── Company client messages ─────────────────────────────────

    CompanySnapshotRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId]
      properties:
        type:
