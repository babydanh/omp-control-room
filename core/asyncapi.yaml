      type: string
      enum: [own_turn, native_child, child_aggregate]

    UsageRecord:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - nativeSessionId
        - nativeEntryId
        - role
        - model
        - provider
        - purpose
        - input
        - output
        - cacheRead
        - cacheWrite
        - timestamp
        - source
        - availability
        - provenance
        - runEpoch
      properties:
        sessionId:
          type: string
          format: uuid
        nativeSessionId:
          type: string
        nativeEntryId:
          type: string
        role:
          $ref: '#/components/schemas/CompanyRole'
        model:
          type: string
        provider:
          type: string
        purpose:
          type: string
        input:
          type: integer
          minimum: 0
        output:
          type: integer
          minimum: 0
        cacheRead:
          type: integer
          minimum: 0
        cacheWrite:
          type: integer
          minimum: 0
        costUsd:
          type: number
          minimum: 0
        timestamp:
          type: string
          format: date-time
        source:
          type: string
          enum: [provider, native_session]
        availability:
          type: string
        # How the entry relates to the owning company session. A native child's
        # spend is kept under its parent's id, and the parent `task` tool result
        # rolls the same calls up again; the provenance is what lets a restored
        # ledger count that spend exactly once.
        provenance:
          $ref: '#/components/schemas/UsageProvenance'
        # Tool call linking a child entry to the parent's rollup of it.
        toolCallId:
          type: string
        # Run the call belonged to. Totals for "this run" are the newest epoch,
        # so a restart cannot silently widen the window to the session lifetime.
        runEpoch:
          type: integer
          minimum: 0
        taskId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        # OMP's own `totalTokens`, when the source reported it.
        totalTokens:
          type: integer
          minimum: 0

    QuotaWindow:
      type: object
      additionalProperties: false
      required: [id, label, reportedUnit]
      properties:
        id:
          type: string
          description: The limit id OMP reports, e.g. `anthropic:5h`. Stable across reads.
        label:
          type: string
        windowLabel:
          type: string
          description: The window's own label (e.g. `5 Hour`), when OMP names one.
        durationMs:
          type: integer
          minimum: 0
        shared:
          type: boolean
          description: True for a limit every model of the account shares. Absent when OMP does not say.
        tier:
          type: string
          description: The model tier a per-model limit applies to, e.g. `fable`.
        used:
          type: number
          minimum: 0
        limit:
          type: number
          minimum: 0
        remaining:
          type: number
        usedFraction:
          type: number
          minimum: 0
          description: Used over limit as OMP reports it. May exceed 1 when the limit is overrun.
        resetAt:
          type: string
          format: date-time
        reportedUnit:
          type: string
          description: The provider's own unit (percent, credits, tokens), never normalised.
        status:
          type: string
          description: OMP's status for the window (ok, warning, exhausted). Absent when OMP reports none.

    QuotaCapacityRow:
      type: object
      additionalProperties: false
      required: [provider, window, durationMs, accounts, usedAccounts, remainingAccounts]
      properties:
        provider:
          type: string
        window:
          type: string
          description: The window id the capacity sums over, e.g. `5h` or `7d`.
        durationMs:
          type: integer
          minimum: 0
        meter:
          type: string
          description: The meter the window belongs to (chat, fable), when OMP names one.
        accounts:
          type: integer
          minimum: 0
        usedAccounts:
          type: number
          minimum: 0
          description: Account-equivalents used, summed across the provider's accounts.
        remainingAccounts:
          type: number
          description: Account-equivalents still available, summed across the provider's accounts.

    QuotaSnapshot:
      type: object
      additionalProperties: false
      required: [provider, windows, fetchedAt, status]
      properties:
        provider:
          type: string
        accountId:
          type: string
          description: OMP's redacted account id. One provider can hold several accounts, so snapshots are keyed by provider and account.
        accountLabel:
          type: string
        note:
          type: string
          description: Why the snapshot carries no windows (no usage endpoint, disabled credential). Redacted.
        windows:
          type: array
          items:
            $ref: '#/components/schemas/QuotaWindow'
        fetchedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [available, unsupported, unauthenticated, error, stale]

    UsageHistoryEntry:
      type: object
      additionalProperties: false
      required: [recordedAt, provider, accountKey, limitId, label]
      properties:
        recordedAt:
          type: string
          format: date-time
        provider:
          type: string
        accountKey:
          type: string
          description: OMP's identity key for the account, redacted.
        email:
          type: string
        accountId:
          type: string
        limitId:
          type: string
        label:
          type: string
        windowLabel:
          type: string
        usedFraction:
          type: number
          minimum: 0
          description: Used over limit. Absent for a limit that reports only a balance, which has no window to fill.
        status:
          type: string
        resetAt:
          type: string
          format: date-time

    UsageClientBurn:
      type: object
      additionalProperties: false
      required: [name, metrics]
      properties:
        name:
          type: string
        metrics:
          type: array
          description: The numeric fields OMP reports for this client, one row each.
          items:
            type: object
            additionalProperties: false
            required: [key, value]
            properties:
              key:
                type: string
              value:
                type: number

    UsageStatsTotals:
      type: object
      additionalProperties: false
      required: [totalRequests, successfulRequests, failedRequests, errorRate, totalInputTokens, totalOutputTokens, totalCacheReadTokens, totalCacheWriteTokens, cacheRate, cacheSavings, totalCost, unpricedRequests, totalPremiumRequests]
      properties:
        totalRequests:
          type: integer
          minimum: 0
        successfulRequests:
          type: integer
          minimum: 0
        failedRequests:
          type: integer
          minimum: 0
        errorRate:
          type: number
          minimum: 0
        totalInputTokens:
          type: integer
          minimum: 0
        totalOutputTokens:
          type: integer
          minimum: 0
        totalCacheReadTokens:
          type: integer
          minimum: 0
        totalCacheWriteTokens:
          type: integer
          minimum: 0
        cacheRate:
          type: number
          minimum: 0
          description: Cache-read tokens over all input-side tokens, as OMP computes it.
        cacheSavings:
          type: number
          description: Share of the uncached prompt cost saved by caching, 0-1 as OMP computes it (negative when cache writes cost more than reads save). Not a dollar amount.
        totalCost:
          type: number
          minimum: 0
          description: USD. Partial when unpricedRequests is above zero.
        unpricedRequests:
          type: integer
          minimum: 0
        totalPremiumRequests:
          type: number
          minimum: 0
        avgDuration:
          type: number
          minimum: 0
          description: Average request duration in ms. Absent when no request in the group was timed.
        avgTtft:
          type: number
          minimum: 0
          description: Average time to first token in ms. Absent when no request in the group reported one.
        avgTokensPerSecond:
          type: number
          minimum: 0
          description: Average output speed in tokens per second. Absent when no request in the group reported one.
        firstAt:
          type: string
          format: date-time
        lastAt:
