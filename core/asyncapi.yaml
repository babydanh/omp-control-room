        conflicts:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/LedgerOverlapConflict'

    LedgerOverlapConflict:
      type: object
      additionalProperties: false
      required: [file, hunks]
      properties:
        file:
          type: string
        hunks:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/LedgerOverlapHunk'

    LedgerOverlapHunk:
      type: object
      additionalProperties: false
      required: [line, symbol, ours, theirs]
      properties:
        line:
          type: integer
          minimum: 0
        symbol:
          type: string
        ours:
          type: array
          maxItems: 6
          items:
            type: string
        theirs:
          type: array
          maxItems: 6
          items:
            type: string

    LedgerSpamRule:
      description: The documented rule that flags a session as spamming. See CLAUDE.md, Board UI.
      type: object
      additionalProperties: false
      required: [windowMinutes, callsPerWindow, sameIntentPerWindow, lookbackMinutes]
      properties:
        windowMinutes:
          type: integer
          minimum: 1
        callsPerWindow:
          type: integer
          minimum: 1
        sameIntentPerWindow:
          type: integer
          minimum: 1
        lookbackMinutes:
          type: integer
          minimum: 1

    LedgerTimeline:
      type: object
      additionalProperties: false
      required: [windowMinutes, bucketSeconds, startedAt, endedAt, lanes, shared, truncated]
      properties:
        windowMinutes:
          type: integer
        bucketSeconds:
          type: integer
          description: Window length divided by 60 buckets.
        startedAt:
          type: string
        endedAt:
          type: string
        lanes:
          type: array
          maxItems: 150
          items:
            $ref: '#/components/schemas/LedgerTimelineLane'
        shared:
          type: array
          description: Pairs of sessions that edited the same file within one bucket.
          maxItems: 200
          items:
            $ref: '#/components/schemas/LedgerSharedFile'
        truncated:
          type: boolean

    LedgerTimelineLane:
      type: object
      additionalProperties: false
      required: [sessionId, agentKind, agentName, repo, spamming, spamReason, total, buckets]
      properties:
        sessionId:
          type: string
        agentKind:
          type: string
        agentName:
          type: string
        repo:
          type: [string, 'null']
        spamming:
          type: boolean
        spamReason:
          type: [string, 'null']
        total:
          type: integer
          minimum: 0
        buckets:
          type: array
          description: Non-empty buckets only.
          maxItems: 60
          items:
            $ref: '#/components/schemas/LedgerTimelineBucket'

    LedgerTimelineBucket:
      type: object
      additionalProperties: false
      required: [index, edit, bash, read, other, intents, files]
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 59
        edit:
          type: integer
          minimum: 0
        bash:
          type: integer
          minimum: 0
        read:
          type: integer
          minimum: 0
        other:
          type: integer
          minimum: 0
        intents:
          type: array
          maxItems: 3
          items:
            type: string
            maxLength: 160
        files:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 260

    LedgerSharedFile:
      type: object
      additionalProperties: false
      required: [a, b, path, bucket]
      properties:
        a:
          type: string
        b:
          type: string
        path:
          type: string
        bucket:
          type: integer
          minimum: 0
          maximum: 59

    CompanyCommandResultMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, ok]
      properties:
        type:
          const: companyCommandResult
        requestId:
          type: string
          format: uuid
        ok:
          type: boolean
        errorCode:
          type: string
        message:
          type: string
        revision:
          type: integer
          minimum: 0
        sessionId:
          type: string
          format: uuid
          description: The session a prompt was delivered to or opened, so the board can make it the current session.
        workItemId:
          type: string
          format: uuid
          description: The work item a companyWorkItemCreate made.
        squadRunId:
          type: string
          format: uuid
          description: The squad run a companySquadRequest started.
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
          description: The folder a folder command created or named.

    CompanyFolderBrowseMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, path, parent, roots, entries, truncated]
      description: >-
        The answer to a companyFolderBrowseRequest, sent to the asking socket only. path is the
        canonical folder listed, or null for the start view, where roots holds the drives (or the
        root) and the home folder.
      properties:
        type:
          const: companyFolderBrowse
        requestId:
          type: string
          format: uuid
        path:
          type: [string, 'null']
        parent:
          type: [string, 'null']
          description: The folder above path; null at a drive root and in the start view.
        roots:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [kind, name, path]
            properties:
              kind:
                type: string
                enum: [drive, root, home]
              name:
                type: string
              path:
                type: string
        entries:
          type: array
          maxItems: 1000
          description: Sub-folders of path, sorted by name. Files are never listed.
          items:
            type: object
            additionalProperties: false
            required: [name, path]
            properties:
              name:
                type: string
              path:
                type: string
        truncated:
          type: boolean
          description: True when the folder holds more sub-folders than entries carries.

    CompanyTextDeltaMessage:
      type: object
      additionalProperties: false
      required: [type, sessionId, runEpoch, seq, text]
      properties:
        type:
          const: companyTextDelta
        sessionId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        runEpoch:
          type: integer
          minimum: 0
        seq:
          type: integer
          minimum: 0
        text:
          type: string
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
          description: Folder this text belongs to. Set by a server running several folders.

    CompanySessionLogEntry:
      type: object
      additionalProperties: false
      required: [seq, at, kind, runEpoch, text]
      properties:
        seq:
          type: integer
          minimum: 0
          description: Per-session order; a replay and a live push share it.
        at:
          type: string
          format: date-time
        kind:
          type: string
          enum: [text, tool, command, verdict, question, state, error]
        runEpoch:
          type: integer
          minimum: 0
        taskId:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 4000
        toolName:
          type: string
        exitCode:
          type: integer
        ok:
          type: boolean
          description: Whether a tool, command or verdict succeeded.

    CompanySessionLogMessage:
      type: object
      additionalProperties: false
      required: [type, sessionId, replay, entries]
      properties:
        type:
          const: companySessionLog
        requestId:
          type: string
          format: uuid
          description: Present on the answer to a companySessionLogRequest.
        sessionId:
          type: string
          format: uuid
        replay:
          type: boolean
          description: True when this is history sent on request; false for a live entry.
        entries:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/CompanySessionLogEntry'

    HerdrAgent:
      type: object
      additionalProperties: false
      required: [paneId, kind, status, workspaceId]
      properties:
        paneId:
          type: string
        name:
          type: string
        kind:
          type: string
          description: The agent herdr detected (omp, claude, codex, ...).
        status:
          type: string
          enum: [working, blocked, idle, done, unknown]
        cwd:
          type: string
        title:
          type: string
          description: The pane's terminal title without spinner glyphs; agents put what they are doing there.
        workspaceId:
          type: string
        workspaceLabel:
          type: string
          description: The herdr workspace's label.
        repo:
          type: string
          description: Name of the git repository the agent's cwd belongs to; worktrees of one repository share it.
        branch:
          type: string
        worktreeRoot:
          type: string
          description: Top-level directory of the git worktree the agent works in.
        focused:
          type: boolean
        workspacePath:
          type: string
          description: Canonical path of the open Company folder that contains the agent's cwd, the deepest match. Absent when the cwd is outside every open folder.
        sessionFile:
          type: string
          description: The agent's transcript file, when the agent reported it to herdr (omp does).
        sessionId:
          type: string
          description: The agent's session id, when the agent reported an id instead of a file.

    HerdrSleepingSession:
      type: object
      additionalProperties: false
      required: [paneId, title, sessionFile, sleptAt]
      properties:
        paneId:
          type: string
        title:
          type: string
          minLength: 1
          description: The name the sleeping pane gives the session (its -Viec text), else the session file's own title or first prompt.
        sessionFile:
          type: string
          description: Path of the omp session file the wake resumes.
        sleptAt:
          type: string
          format: date-time
          description: When the session was put to sleep (the moment its exit was requested).
        cwd:
          type: string
          description: Working directory the sleeping pane stands in; the wake resumes the session there.
        workspaceLabel:
          type: string
          description: The herdr workspace's label.
        repo:
          type: string
          description: Name of the git repository the cwd belongs to; same grouping as herdr agents.
        branch:
          type: string
        worktreeRoot:
          type: string
          description: Top-level directory of the git worktree the session works in.
        workspacePath:
          type: string
          description: Canonical path of the open Company folder that contains the cwd, the deepest match. Absent when the cwd is outside every open folder.

    HerdrAgentsMessage:
      type: object
      additionalProperties: false
      required: [type, available, agents, sleeping]
      properties:
        type:
          const: herdrAgents
        available:
          type: boolean
          description: False when no herdr server answers; the board hides the group.
        reason:
          type: string
        agents:
          type: array
          items:
            $ref: '#/components/schemas/HerdrAgent'
        sleeping:
          type: array
          description: Omp sessions asleep in a herdr pane, waiting for a wake. A session leaves this list once herdr reports its omp agent running.
          items:
            $ref: '#/components/schemas/HerdrSleepingSession'

    HerdrScreenMessage:
      type: object
      additionalProperties: false
      required: [type, paneId, text, at]
      properties:
        type:
          const: herdrScreen
        requestId:
          type: string
          format: uuid
        paneId:
          type: string
        text:
          type: string
        at:
          type: string
          format: date-time

    BrowserReaperStatusMessage:
      description: |
        The omp headless browsers this host's browser reaper manages, and what it
        has stopped. Sent to privileged connections only: on a company snapshot
        request, and after every reaper check or "Dọn ngay". `enabled: false`
        means the reaper is off (`--no-browser-reaper` or
        `PIXEL_AGENTS_BROWSER_REAPER=0`): nothing is probed or stopped and
        `browsers` is empty. `reapedCount` and `freedMb` count since this server
        started; `freedMb` is the summed working set of each stopped browser's
        process tree, read before the stop, so it is an estimate.
      type: object
      additionalProperties: false
      required: [type, enabled, browsers, reapedCount, freedMb]
      properties:
        type:
          const: browserReaperStatus
        enabled:
          type: boolean
        browsers:
          type: array
          description: Ready, non-persistent omp headless browsers whose DevTools endpoint this check could reach.
          items:
            $ref: '#/components/schemas/BrowserReaperBrowser'
        reapedCount:
          type: integer
          minimum: 0
        freedMb:
          type: number
          minimum: 0

    BrowserReaperBrowser:
      type: object
      additionalProperties: false
      required: [projectDir, pages, idleSince, uptimeMs]
      properties:
        projectDir:
          type: string
          description: The project folder omp runs this browser for.
        pages:
          type: integer
          minimum: 0
          description: Page targets open on the browser's DevTools endpoint at this check.
        idleSince:
          type: [string, 'null']
          description: ISO time this browser first had zero pages in its current run of checks; null while it has pages.
        uptimeMs:
          type: integer
          minimum: 0

    BrowserReaperReapNow:
      description: |
        "Dọn ngay": stop every managed omp headless browser that has zero pages
        now, without waiting out the grace period. A browser with pages is never
        touched. Privileged; answered by a `browserReaperStatus` broadcast.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: browserReaperReapNow

    AgentToolInfo:
      type: object
      additionalProperties: false
      required: [name, source, active]
      properties:
        name:
          type: string
        source:
          type: string
          enum: [builtin, extension, mcp, sdk, other]
        mcpServer:
          type: string
          description: The MCP server a tool fronts, when it is an MCP tool.
        active:
          type: boolean
          description: Whether the tool is in the session's active set right now.

    AgentSkillInfo:
      type: object
      additionalProperties: false
      required: [name, used]
      properties:
        name:
          type: string
        description:
          type: string
        used:
          type: boolean
          description: Whether the session read this skill.

    AgentToolUsage:
      type: object
      additionalProperties: false
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
          minimum: 0

    AgentInfo:
      type: object
      additionalProperties: false
      required: [collectedFrom, collectedAt]
      description: What an agent is set up with and has been doing; every list is optional because each source knows only part of it.
      properties:
        cwd:
          type: string
          description: Where the agent works now (the foreground process's directory when known).
        launchCwd:
          type: string
          description: The directory the agent was started in, when it differs from cwd.
        model:
          type: string
        thinking:
          type: string
        sessionFile:
          type: string
        tools:
          type: array
          items:
            $ref: '#/components/schemas/AgentToolInfo'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/AgentSkillInfo'
        toolUsage:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AgentToolUsage'
        collectedFrom:
          type: string
          enum: [live, transcript, herdr]
          description: live = asked the running OMP; transcript = read its session file; herdr = only what herdr knows.
        collectedAt:
          type: string
          format: date-time
        note:
          type: string
          description: Why some of the info is missing.

    CompanySessionInfoMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, sessionId, info]
      properties:
        type:
          const: companySessionInfo
        requestId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        info:
          $ref: '#/components/schemas/AgentInfo'

    HerdrInfoMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, paneId, info]
      properties:
        type:
          const: herdrInfo
        requestId:
          type: string
          format: uuid
        paneId:
          type: string
        info:
          $ref: '#/components/schemas/AgentInfo'

    OmpSessionEntry:
      type: object
      additionalProperties: false
      required: [file, updatedAt, sizeBytes]
      properties:
        file:
          type: string
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        sizeBytes:
          type: integer
          minimum: 0
        boardSessionId:
          type: string
          format: uuid
          description: Set when a board session already runs this file.

    CompanyOmpSessionsMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, folder, sessions]
      properties:
        type:
          const: companyOmpSessions
        requestId:
          type: string
          format: uuid
        folder:
          type: string
        sessions:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/OmpSessionEntry'

    CompanyWorkspaceEntry:
      type: object
      additionalProperties: false
      required: [path, active, open, working, waiting]
      properties:
        path:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: The display name the user gave this folder. Absent means the folder's own name.
        active:
          type: boolean
          description: The folder this board is showing.
        open:
          type: boolean
          description: Whether its Company is running on this server (its agents keep working while another folder is shown).
        working:
          type: integer
          minimum: 0
        waiting:
          type: integer
          minimum: 0
          description: Sessions or Contracts waiting on the user.
        missing:
          type: boolean
          description: An open folder whose directory is no longer on disk. It stays listed once until it is forgotten.
        sessions:
          type: array
          maxItems: 100
          description: The folder's live (not archived) sessions, so the board's tree shows what is inside a folder it is not showing.
          items:
            $ref: '#/components/schemas/CompanyWorkspaceSession'

    CompanyWorkspaceSession:
      type: object
