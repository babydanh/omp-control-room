      properties:
        type:
          const: companyOmpSessionsRequest
        requestId:
          type: string
          format: uuid

    CompanySessionResumeMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, file]
      description: Open a saved OMP session of the active folder as a chat session.
      properties:
        type:
          const: companySessionResume
        requestId:
          type: string
          format: uuid
        file:
          type: string
          maxLength: 4096

    CompanyWorkspaceOpenMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, path]
      description: Make a folder the board's active folder, opening its Company if it is not open yet.
      properties:
        type:
          const: companyWorkspaceOpen
        requestId:
          type: string
          format: uuid
        path:
          type: string
          minLength: 1
          maxLength: 4096

    CompanySettingsUpdateMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, roleProfiles]
      properties:
        type:
          const: companySettingsUpdate
        requestId:
          type: string
          format: uuid
        roleProfiles:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RoleProfile'

    CompanyModelCatalogRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId]
      properties:
        type:
          const: companyModelCatalogRequest
        requestId:
          type: string
          format: uuid

    CompanyArtifactRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, artifactId, offset]
      properties:
        type:
          const: companyArtifactRequest
        requestId:
          type: string
          format: uuid
        artifactId:
          type: string
          format: uuid
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 65536

    CompanyFileListRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, path]
      properties:
        type:
          const: companyFileListRequest
        requestId:
          type: string
          format: uuid
        path:
          type: string
          maxLength: 1024
          description: Workspace-relative directory path; '' is the workspace root.

    CompanyFileReadRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, path, offset]
      properties:
        type:
          const: companyFileReadRequest
        requestId:
          type: string
          format: uuid
        path:
          type: string
          maxLength: 1024
          description: Workspace-relative file path; never a client filesystem path.
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 262144

    CompanyAttachmentUploadMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, fileName, mediaType, dataBase64]
      properties:
        type:
          const: companyAttachmentUpload
        requestId:
          type: string
          format: uuid
        fileName:
          type: string
          maxLength: 512
        mediaType:
          type: string
          maxLength: 255
        dataBase64:
          type: string
          maxLength: 8388608

    CompanySessionLogRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, sessionId]
      properties:
        type:
          const: companySessionLogRequest
        requestId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        limit:
          type: integer
          minimum: 1
          maximum: 500

    HerdrReadMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, paneId]
      properties:
        type:
          const: herdrRead
        requestId:
          type: string
          format: uuid
        paneId:
          type: string
          maxLength: 64
        lines:
          type: integer
          minimum: 1
          maximum: 2000

    HerdrPromptMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, paneId, text]
      properties:
        type:
          const: herdrPrompt
        requestId:
          type: string
          format: uuid
        paneId:
          type: string
          maxLength: 64
        text:
          type: string
          minLength: 1
          maxLength: 100000

    HerdrKeysMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, paneId, keys]
      properties:
        type:
          const: herdrKeys
        requestId:
          type: string
          format: uuid
        paneId:
          type: string
          maxLength: 64
        keys:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/HerdrKey'

    HerdrKey:
      type: string
      description: The keys the board lets a person press in a herdr agent's UI.
      enum: [up, down, left, right, enter, esc, tab, ctrl+c, '1', '2', '3', y, n]

    HerdrFocusMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, paneId]
      properties:
        type:
          const: herdrFocus
        requestId:
          type: string
          format: uuid
        paneId:
          type: string
          maxLength: 64

    CompanySessionRenameMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, sessionId, name]
      properties:
        type:
          const: companySessionRename
        requestId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 60

    CompanySessionInfoRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, sessionId]
      properties:
        type:
          const: companySessionInfoRequest
        requestId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid

    HerdrRenameMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, paneId, name]
      properties:
        type:
          const: herdrRename
        requestId:
          type: string
          format: uuid
        paneId:
          type: string
          maxLength: 64
        name:
          type: string
          description: herdr agent names match [a-z][a-z0-9_-]{0,31}; the server validates.
          minLength: 1
          maxLength: 32

    HerdrInfoRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, paneId]
      properties:
        type:
          const: herdrInfoRequest
        requestId:
          type: string
          format: uuid
        paneId:
          type: string
          maxLength: 64

    HerdrWakeMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, paneId]
      properties:
        type:
          const: herdrWake
        requestId:
          type: string
          format: uuid
        paneId:
          type: string
          maxLength: 64
        prompt:
          type: string
          description: One line sent with Enter to the sleeping pane, so the session resumes with it. Omit to resume without a prompt.
          minLength: 1
          maxLength: 4000

    TerminalAttachMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, sessionId, runEpoch]
      properties:
        type:
          const: terminalAttach
        requestId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        runEpoch:
          type: integer
          minimum: 0
        cols:
          type: integer
          minimum: 20
          maximum: 500
        rows:
          type: integer
          minimum: 5
          maximum: 300

    TerminalInputMessage:
      type: object
      additionalProperties: false
      required: [type, sessionId, runEpoch, leaseId, data]
      properties:
        type:
          const: terminalInput
        sessionId:
          type: string
          format: uuid
        leaseId:
          type: string
          format: uuid
        runEpoch:
          type: integer
          minimum: 0
        data:
          type: string
          maxLength: 8192
          description: One input chunk; never queued across a disconnect.

    TerminalResizeMessage:
      type: object
      additionalProperties: false
      required: [type, sessionId, runEpoch, leaseId, cols, rows]
      properties:
        type:
          const: terminalResize
        sessionId:
          type: string
          format: uuid
        runEpoch:
          type: integer
          minimum: 0
        leaseId:
          type: string
          format: uuid
        cols:
          type: integer
          minimum: 20
          maximum: 500
        rows:
          type: integer
          minimum: 5
          maximum: 300

    TerminalDetachMessage:
      type: object
      additionalProperties: false
      required: [type, sessionId, runEpoch, leaseId]
      properties:
        type:
          const: terminalDetach
        sessionId:
          type: string
          format: uuid
        runEpoch:
          type: integer
          minimum: 0
        leaseId:
          type: string
          format: uuid

    # ── Company server messages ─────────────────────────────────

    CompanySnapshotMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, snapshot]
      properties:
        type:
          const: companySnapshot
        requestId:
          type: string
          format: uuid
        snapshot:
          $ref: '#/components/schemas/CompanySnapshot'

    CompanyStateChangedMessage:
      type: object
      additionalProperties: false
      required: [type, revision, changes]
      properties:
        type:
          const: companyStateChanged
        revision:
          type: integer
          minimum: 1
        changes:
          type: array
          items:
            $ref: '#/components/schemas/CompanyChange'

    # ── Ledger: git graph + activity timeline (privileged) ─────────
    # Read-only views of the activity ledger (~/.omp/agent/activity.db) and of
    # the git checkouts it names, plus two commands: a message to a live session
    # (through who.py send) and a read-only file diff. Nothing here edits the
    # ledger or any checkout. Timestamps are the ledger's local
    # `YYYY-MM-DD HH:MM:SS` strings, passed through unchanged.

    LedgerViewRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId]
      properties:
        type:
          const: ledgerViewRequest
        requestId:
          type: string
          format: uuid

    LedgerTimelineRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, windowMinutes]
      properties:
        type:
          const: ledgerTimelineRequest
        requestId:
          type: string
          format: uuid
        windowMinutes:
          type: integer
          enum: [15, 60, 360, 1440]

    LedgerFileDiffRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, worktree, path]
      properties:
        type:
          const: ledgerFileDiffRequest
        requestId:
          type: string
          format: uuid
        worktree:
          type: string
          minLength: 1
          maxLength: 1024
        path:
          type: string
          minLength: 1
          maxLength: 1024

    LedgerSendMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, sessionId, text]
      properties:
        type:
          const: ledgerSendMessage
        requestId:
          type: string
          format: uuid
        sessionId:
          type: string
          minLength: 1
          maxLength: 128
        text:
          type: string
          minLength: 1
          maxLength: 4000

    LedgerSnapshotMessage:
      description: >-
        The whole ledger view. With requestId it answers a ledgerViewRequest;
        without it, it is a broadcast sent to privileged clients when the view
        changes.
      type: object
      additionalProperties: false
      required: [type, view]
      properties:
        type:
          const: ledgerSnapshot
        requestId:
          type: string
          format: uuid
        view:
          $ref: '#/components/schemas/LedgerView'

    LedgerTimelineMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, timeline]
      properties:
        type:
          const: ledgerTimeline
        requestId:
          type: string
          format: uuid
        timeline:
          $ref: '#/components/schemas/LedgerTimeline'

    LedgerFileDiffMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, ok, worktree, path, diff, truncated]
      properties:
        type:
          const: ledgerFileDiff
        requestId:
          type: string
          format: uuid
        ok:
          type: boolean
        worktree:
          type: string
        path:
          type: string
        diff:
          type: string
          description: Unified diff text, cut to a fixed byte budget when `truncated` is true.
        truncated:
          type: boolean
        reason:
          type: string

    LedgerCommandResultMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, ok]
      properties:
        type:
          const: ledgerCommandResult
        requestId:
          type: string
          format: uuid
        ok:
          type: boolean
        reason:
          type: string
          description: Vietnamese refusal or failure reason when ok is false.
        delivered:
          type: array
          maxItems: 20
          items:
            type: string

    LedgerView:
      type: object
      additionalProperties: false
      required: [generatedAt, database, repos, unscannedFolders, sessions, pending, notices, mainWrites, overlaps, spamRule]
      properties:
        generatedAt:
          type: string
        database:
          $ref: '#/components/schemas/LedgerDatabaseStatus'
        repos:
          type: array
          maxItems: 24
          items:
            $ref: '#/components/schemas/LedgerRepo'
        unscannedFolders:
          type: array
          description: Folders named by recent ledger events that are not git repositories.
          maxItems: 50
          items:
            type: string
        sessions:
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/LedgerSession'
        pending:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/LedgerPending'
        notices:
          type: array
          description: Ledger notices not yet delivered to their session (delivered = 0), newest first.
          maxItems: 50
          items:
            $ref: '#/components/schemas/LedgerNotice'
        mainWrites:
          type: array
          description: Edits and writes made in a main checkout during the last 24 hours, newest first.
          maxItems: 50
          items:
            $ref: '#/components/schemas/LedgerMainWrite'
        overlaps:
          type: array
          maxItems: 24
          items:
            $ref: '#/components/schemas/LedgerOverlapScan'
        spamRule:
          $ref: '#/components/schemas/LedgerSpamRule'

    LedgerDatabaseStatus:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [ok, missing, unreadable]
        error:
          type: string

    LedgerRepo:
      type: object
      additionalProperties: false
      required: [repo, name, worktrees]
      properties:
        repo:
          type: string
          description: Main repository root, forward slashes.
        name:
          type: string
        worktrees:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/LedgerWorktree'

    LedgerWorktree:
      type: object
      additionalProperties: false
      required: [path, name, branch, head, isMain, ahead, behind, dirtyCount, dirtyFiles, merged, hasUpstream, lastCommitSubject, lastCommitAt, sessionIds]
      properties:
        path:
          type: string
        name:
          type: string
        branch:
          type: [string, 'null']
        head:
          type: string
          description: Short commit id; empty when the checkout has no commit yet.
        isMain:
          type: boolean
        ahead:
          type: integer
          minimum: 0
          description: Commits on this checkout's HEAD that origin/main lacks.
        behind:
          type: integer
          minimum: 0
          description: Commits on origin/main that this checkout's HEAD lacks.
        dirtyCount:
          type: integer
          minimum: 0
        dirtyFiles:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/LedgerDirtyFile'
        merged:
          type: boolean
          description: HEAD is an ancestor of origin/main (its work is already in main).
        hasUpstream:
          type: boolean
        lastCommitSubject:
          type: string
          maxLength: 200
        lastCommitAt:
          type: [string, 'null']
        sessionIds:
          type: array
          maxItems: 40
          items:
            type: string
        gitError:
          type: string

    LedgerDirtyFile:
      type: object
      additionalProperties: false
      required: [path, status]
      properties:
        path:
          type: string
        status:
          type: string
          description: Two-character porcelain status, e.g. " M", "A ", "??".

    LedgerSession:
      type: object
      additionalProperties: false
      required: [sessionId, agentKind, agentName, open, live, state, cwd, repo, checkout, branch, lastIntent, lastCallAt, calls5m, calls30m, spamming, spamReason, pid]
      properties:
        sessionId:
          type: string
        agentKind:
          type: string
          description: "main or sub (sub-agents spawned by a main session)."
        agentName:
          type: string
        parentId:
          type: [string, 'null']
        open:
          type: boolean
          description: ended_at is NULL in the ledger.
        live:
          type: boolean
          description: Open and heartbeat within the last 60 seconds.
        state:
          type: string
        cwd:
          type: string
        repo:
          type: [string, 'null']
        checkout:
          type: [string, 'null']
          description: Checkout of the session's most recent file or shell event that names one.
        branch:
          type: [string, 'null']
        lastIntent:
          type: [string, 'null']
        lastCallAt:
          type: [string, 'null']
        calls5m:
          type: integer
          minimum: 0
        calls30m:
          type: integer
          minimum: 0
        spamming:
          type: boolean
        spamReason:
          type: [string, 'null']
        pid:
          type: [integer, 'null']

    LedgerPending:
      type: object
      additionalProperties: false
      required: [checkout, sessionId, branch, dirty, unpushed, notInMain, hasRemote, ts]
      properties:
        checkout:
          type: string
        sessionId:
          type: [string, 'null']
        branch:
          type: [string, 'null']
        dirty:
          type: integer
          minimum: 0
        unpushed:
          type: integer
          minimum: 0
        notInMain:
          type: integer
          minimum: 0
        hasRemote:
          type: boolean
        ts:
          type: string

    LedgerNotice:
      type: object
      additionalProperties: false
      required: [id, ts, toSession, fromSession, relKey, content]
      properties:
        id:
          type: integer
        ts:
          type: string
        toSession:
          type: string
        fromSession:
          type: [string, 'null']
        relKey:
          type: [string, 'null']
        content:
          type: string
          maxLength: 400

    LedgerMainWrite:
      type: object
      additionalProperties: false
      required: [sessionId, ts, tool, path, intent]
      properties:
        sessionId:
          type: string
        ts:
          type: string
        tool:
          type: [string, 'null']
        path:
          type: [string, 'null']
        intent:
          type: [string, 'null']

    LedgerOverlapScan:
      description: Last overlap.py scan of one repository. `state` says whether the answer is complete.
      type: object
      additionalProperties: false
      required: [repo, state, startedAt, finishedAt, base, lanes, pairs, main, pending, complete, error]
      properties:
        repo:
          type: string
        state:
          type: string
          enum: [idle, running, done, partial, error]
        startedAt:
          type: [string, 'null']
        finishedAt:
          type: [string, 'null']
        base:
          type: [string, 'null']
        lanes:
          type: integer
          minimum: 0
        pairs:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/LedgerOverlapPair'
        main:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/LedgerOverlapMain'
        pending:
          type: array
          description: Labels of checks the budget did not reach. Unchecked is not clean.
          maxItems: 200
          items:
            type: string
        complete:
          type: boolean
        error:
          type: [string, 'null']

    LedgerOverlapPair:
      type: object
      additionalProperties: false
      required: [a, b, aLabel, bLabel, conflicts, auto]
      properties:
        a:
          type: string
        b:
          type: string
        aLabel:
          type: string
        bLabel:
          type: string
        conflicts:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/LedgerOverlapConflict'
        auto:
          type: array
          description: Files both lanes changed in separate hunks that git or Mergiraf merges by itself.
          maxItems: 100
          items:
            type: string

    LedgerOverlapMain:
      type: object
      additionalProperties: false
      required: [lane, label, conflicts]
      properties:
        lane:
          type: string
        label:
          type: string
        conflicts:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/LedgerOverlapConflict'

    LedgerOverlapConflict:
      type: object
      additionalProperties: false
      required: [file, hunks]
      properties:
        file:
          type: string
        hunks:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/LedgerOverlapHunk'

    LedgerOverlapHunk:
      type: object
      additionalProperties: false
      required: [line, symbol, ours, theirs]
      properties:
        line:
          type: integer
          minimum: 0
        symbol:
          type: string
        ours:
          type: array
          maxItems: 6
          items:
            type: string
        theirs:
          type: array
          maxItems: 6
          items:
            type: string

    LedgerSpamRule:
      description: The documented rule that flags a session as spamming. See CLAUDE.md, Board UI.
      type: object
      additionalProperties: false
      required: [windowMinutes, callsPerWindow, sameIntentPerWindow, lookbackMinutes]
      properties:
        windowMinutes:
          type: integer
          minimum: 1
        callsPerWindow:
          type: integer
          minimum: 1
        sameIntentPerWindow:
          type: integer
          minimum: 1
        lookbackMinutes:
          type: integer
          minimum: 1

    LedgerTimeline:
      type: object
      additionalProperties: false
      required: [windowMinutes, bucketSeconds, startedAt, endedAt, lanes, shared, truncated]
      properties:
        windowMinutes:
          type: integer
        bucketSeconds:
          type: integer
          description: Window length divided by 60 buckets.
        startedAt:
          type: string
        endedAt:
          type: string
        lanes:
          type: array
          maxItems: 150
          items:
            $ref: '#/components/schemas/LedgerTimelineLane'
        shared:
          type: array
          description: Pairs of sessions that edited the same file within one bucket.
          maxItems: 200
          items:
            $ref: '#/components/schemas/LedgerSharedFile'
        truncated:
          type: boolean

    LedgerTimelineLane:
      type: object
      additionalProperties: false
      required: [sessionId, agentKind, agentName, repo, spamming, spamReason, total, buckets]
      properties:
        sessionId:
          type: string
        agentKind:
          type: string
        agentName:
          type: string
        repo:
          type: [string, 'null']
        spamming:
          type: boolean
        spamReason:
          type: [string, 'null']
        total:
          type: integer
          minimum: 0
        buckets:
          type: array
          description: Non-empty buckets only.
          maxItems: 60
          items:
            $ref: '#/components/schemas/LedgerTimelineBucket'

    LedgerTimelineBucket:
      type: object
      additionalProperties: false
      required: [index, edit, bash, read, other, intents, files]
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 59
        edit:
          type: integer
          minimum: 0
        bash:
          type: integer
          minimum: 0
        read:
          type: integer
          minimum: 0
        other:
          type: integer
          minimum: 0
        intents:
          type: array
          maxItems: 3
          items:
            type: string
            maxLength: 160
        files:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 260

    LedgerSharedFile:
      type: object
      additionalProperties: false
      required: [a, b, path, bucket]
      properties:
        a:
          type: string
        b:
          type: string
        path:
          type: string
        bucket:
          type: integer
          minimum: 0
          maximum: 59

    CompanyCommandResultMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, ok]
      properties:
        type:
          const: companyCommandResult
        requestId:
          type: string
          format: uuid
        ok:
          type: boolean
        errorCode:
          type: string
        message:
          type: string
        revision:
          type: integer
          minimum: 0
        sessionId:
          type: string
          format: uuid
          description: The session a prompt was delivered to or opened, so the board can make it the current session.

    CompanyTextDeltaMessage:
      type: object
      additionalProperties: false
      required: [type, sessionId, runEpoch, seq, text]
      properties:
        type:
          const: companyTextDelta
        sessionId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        runEpoch:
          type: integer
          minimum: 0
        seq:
          type: integer
          minimum: 0
        text:
          type: string

    CompanySessionLogEntry:
      type: object
      additionalProperties: false
      required: [seq, at, kind, runEpoch, text]
      properties:
        seq:
          type: integer
          minimum: 0
          description: Per-session order; a replay and a live push share it.
        at:
          type: string
          format: date-time
        kind:
          type: string
          enum: [text, tool, command, verdict, question, state, error]
        runEpoch:
          type: integer
          minimum: 0
        taskId:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 4000
        toolName:
          type: string
        exitCode:
          type: integer
        ok:
          type: boolean
          description: Whether a tool, command or verdict succeeded.

    CompanySessionLogMessage:
      type: object
      additionalProperties: false
      required: [type, sessionId, replay, entries]
      properties:
        type:
          const: companySessionLog
        requestId:
          type: string
          format: uuid
          description: Present on the answer to a companySessionLogRequest.
        sessionId:
          type: string
          format: uuid
        replay:
          type: boolean
          description: True when this is history sent on request; false for a live entry.
        entries:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/CompanySessionLogEntry'

    HerdrAgent:
      type: object
      additionalProperties: false
      required: [paneId, kind, status, workspaceId]
      properties:
        paneId:
          type: string
        name:
          type: string
        kind:
          type: string
          description: The agent herdr detected (omp, claude, codex, ...).
        status:
          type: string
          enum: [working, blocked, idle, done, unknown]
        cwd:
          type: string
        title:
          type: string
          description: The pane's terminal title without spinner glyphs; agents put what they are doing there.
        workspaceId:
          type: string
        workspaceLabel:
          type: string
          description: The herdr workspace's label.
        repo:
          type: string
          description: Name of the git repository the agent's cwd belongs to; worktrees of one repository share it.
        branch:
          type: string
        worktreeRoot:
          type: string
          description: Top-level directory of the git worktree the agent works in.
        focused:
          type: boolean

    HerdrSleepingSession:
      type: object
      additionalProperties: false
      required: [paneId, title, sessionFile, sleptAt]
      properties:
        paneId:
          type: string
        title:
          type: string
          minLength: 1
          description: The name the sleeping pane gives the session (its -Viec text), else the session file's own title or first prompt.
        sessionFile:
          type: string
          description: Path of the omp session file the wake resumes.
        sleptAt:
          type: string
          format: date-time
          description: When the session was put to sleep (the moment its exit was requested).
        cwd:
          type: string
          description: Working directory the sleeping pane stands in; the wake resumes the session there.
        workspaceLabel:
          type: string
          description: The herdr workspace's label.
        repo:
          type: string
          description: Name of the git repository the cwd belongs to; same grouping as herdr agents.
        branch:
          type: string
        worktreeRoot:
          type: string
          description: Top-level directory of the git worktree the session works in.

    HerdrAgentsMessage:
      type: object
      additionalProperties: false
      required: [type, available, agents, sleeping]
      properties:
        type:
          const: herdrAgents
        available:
          type: boolean
          description: False when no herdr server answers; the board hides the group.
        reason:
          type: string
        agents:
          type: array
          items:
            $ref: '#/components/schemas/HerdrAgent'
        sleeping:
          type: array
          description: Omp sessions asleep in a herdr pane, waiting for a wake. A session leaves this list once herdr reports its omp agent running.
          items:
            $ref: '#/components/schemas/HerdrSleepingSession'

    HerdrScreenMessage:
      type: object
      additionalProperties: false
      required: [type, paneId, text, at]
      properties:
        type:
          const: herdrScreen
        requestId:
          type: string
          format: uuid
        paneId:
          type: string
        text:
          type: string
        at:
          type: string
          format: date-time

    AgentToolInfo:
      type: object
      additionalProperties: false
      required: [name, source, active]
      properties:
        name:
          type: string
        source:
          type: string
          enum: [builtin, extension, mcp, sdk, other]
        mcpServer:
          type: string
          description: The MCP server a tool fronts, when it is an MCP tool.
        active:
          type: boolean
          description: Whether the tool is in the session's active set right now.

    AgentSkillInfo:
      type: object
      additionalProperties: false
      required: [name, used]
      properties:
        name:
          type: string
        description:
          type: string
        used:
          type: boolean
          description: Whether the session read this skill.

    AgentToolUsage:
      type: object
      additionalProperties: false
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
          minimum: 0

    AgentInfo:
      type: object
      additionalProperties: false
      required: [collectedFrom, collectedAt]
      description: What an agent is set up with and has been doing; every list is optional because each source knows only part of it.
      properties:
        cwd:
          type: string
          description: Where the agent works now (the foreground process's directory when known).
        launchCwd:
          type: string
          description: The directory the agent was started in, when it differs from cwd.
        model:
          type: string
        thinking:
          type: string
        sessionFile:
          type: string
        tools:
          type: array
          items:
            $ref: '#/components/schemas/AgentToolInfo'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/AgentSkillInfo'
        toolUsage:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AgentToolUsage'
        collectedFrom:
          type: string
          enum: [live, transcript, herdr]
          description: live = asked the running OMP; transcript = read its session file; herdr = only what herdr knows.
        collectedAt:
          type: string
          format: date-time
        note:
          type: string
          description: Why some of the info is missing.

    CompanySessionInfoMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, sessionId, info]
      properties:
        type:
          const: companySessionInfo
        requestId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        info:
          $ref: '#/components/schemas/AgentInfo'

    HerdrInfoMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, paneId, info]
      properties:
        type:
          const: herdrInfo
        requestId:
          type: string
          format: uuid
        paneId:
          type: string
        info:
          $ref: '#/components/schemas/AgentInfo'

    OmpSessionEntry:
      type: object
      additionalProperties: false
      required: [file, updatedAt, sizeBytes]
      properties:
        file:
          type: string
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        sizeBytes:
          type: integer
          minimum: 0
        boardSessionId:
          type: string
          format: uuid
          description: Set when a board session already runs this file.

    CompanyOmpSessionsMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, folder, sessions]
      properties:
        type:
          const: companyOmpSessions
        requestId:
          type: string
          format: uuid
        folder:
          type: string
        sessions:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/OmpSessionEntry'

    CompanyWorkspaceEntry:
      type: object
      additionalProperties: false
      required: [path, active, open, working, waiting]
      properties:
        path:
          type: string
        active:
          type: boolean
          description: The folder this board is showing.
        open:
          type: boolean
          description: Whether its Company is running on this server (its agents keep working while another folder is shown).
        working:
          type: integer
          minimum: 0
        waiting:
          type: integer
          minimum: 0
          description: Sessions or Contracts waiting on the user.
        sessions:
          type: array
          maxItems: 100
          description: The folder's live (not archived) sessions, so the board's tree shows what is inside a folder it is not showing.
          items:
            $ref: '#/components/schemas/CompanyWorkspaceSession'

    CompanyWorkspaceSession:
      type: object
      additionalProperties: false
      required: [id, code, name, role, status]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/CompanyRole'
        status:
          type: string

    CompanyWorkspacesMessage:
      type: object
      additionalProperties: false
      required: [type, workspaces]
      properties:
        type:
          const: companyWorkspaces
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/CompanyWorkspaceEntry'

    CompanyModelCatalogMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, entries]
      properties:
        type:
          const: companyModelCatalog
        requestId:
          type: string
          format: uuid
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CompanyModelCatalogEntry'

    CompanyArtifactPageMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, page]
      properties:
        type:
          const: companyArtifactPage
        requestId:
          type: string
          format: uuid
        page:
          $ref: '#/components/schemas/ArtifactPage'

    CompanyFileListMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, path, entries]
      properties:
        type:
          const: companyFileList
        requestId:
          type: string
          format: uuid
        path:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CompanyFileEntry'

    CompanyFileReadMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, content]
      properties:
        type:
          const: companyFileRead
        requestId:
          type: string
          format: uuid
        content:
          $ref: '#/components/schemas/CompanyFileContent'

    CompanyAttachmentUploadedMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, attachment]
      properties:
        type:
          const: companyAttachmentUploaded
        requestId:
          type: string
          format: uuid
        attachment:
          $ref: '#/components/schemas/PromptAttachment'

    TerminalAttachedMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, sessionId, runEpoch, leaseId, cols, rows]
      properties:
        type:
          const: terminalAttached
        requestId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        runEpoch:
          type: integer
          minimum: 0
        leaseId:
          type: string
          format: uuid
          description: Controller lease; the last attach for a session wins.
        cols:
          type: integer
          minimum: 1
        rows:
          type: integer
          minimum: 1

    TerminalSnapshotMessage:
      type: object
      additionalProperties: false
      required: [type, sessionId, runEpoch, seq, data]
      properties:
        type:
          const: terminalSnapshot
        sessionId:
          type: string
          format: uuid
        runEpoch:
          type: integer
          minimum: 0
        seq:
          type: integer
          minimum: 0
        data:
          type: string
          description: Base64 serialized framebuffer, replayed on reattach.

    TerminalDataMessage:
      type: object
      additionalProperties: false
      required: [type, sessionId, runEpoch, seq, data]
      properties:
        type:
          const: terminalData
        sessionId:
          type: string
          format: uuid
        runEpoch:
          type: integer
          minimum: 0
        seq:
          type: integer
          minimum: 0
        data:
          type: string
          description: Base64-encoded bytes exactly as the PTY produced them.

    TerminalClosedMessage:
      type: object
      additionalProperties: false
      required: [type, sessionId, runEpoch, seq, reason]
      properties:
        type:
          const: terminalClosed
        sessionId:
          type: string
          format: uuid
        runEpoch:
          type: integer
          minimum: 0
        seq:
          type: integer
          minimum: 0
        reason:
          type: string
