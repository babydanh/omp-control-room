    UsageRecord:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - nativeSessionId
        - nativeEntryId
        - role
        - model
        - provider
        - purpose
        - input
        - output
        - cacheRead
        - cacheWrite
        - timestamp
        - source
        - availability
        - provenance
        - runEpoch
      properties:
        sessionId:
          type: string
          format: uuid
        nativeSessionId:
          type: string
        nativeEntryId:
          type: string
        role:
          $ref: '#/components/schemas/CompanyRole'
        model:
          type: string
        provider:
          type: string
        purpose:
          type: string
        input:
          type: integer
          minimum: 0
        output:
          type: integer
          minimum: 0
        cacheRead:
          type: integer
          minimum: 0
        cacheWrite:
          type: integer
          minimum: 0
        costUsd:
          type: number
          minimum: 0
        timestamp:
          type: string
          format: date-time
        source:
          type: string
          enum: [provider, native_session]
        availability:
          type: string
        # How the entry relates to the owning company session. A native child's
        # spend is kept under its parent's id, and the parent `task` tool result
        # rolls the same calls up again; the provenance is what lets a restored
        # ledger count that spend exactly once.
        provenance:
          $ref: '#/components/schemas/UsageProvenance'
        # Tool call linking a child entry to the parent's rollup of it.
        toolCallId:
          type: string
        # Run the call belonged to. Totals for "this run" are the newest epoch,
        # so a restart cannot silently widen the window to the session lifetime.
        runEpoch:
          type: integer
          minimum: 0
        taskId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        # OMP's own `totalTokens`, when the source reported it.
        totalTokens:
          type: integer
          minimum: 0

