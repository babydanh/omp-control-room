          description: Short commit id; empty when the checkout has no commit yet.
        isMain:
          type: boolean
        ahead:
          type: integer
          minimum: 0
          description: Commits on this checkout's HEAD that origin/main lacks.
        behind:
          type: integer
          minimum: 0
