          $ref: '#/components/schemas/SubmitPromptInput'

    CompanyContractDecisionMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, contractId, revision, decision]
      properties:
        type:
          const: companyContractDecision
        requestId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        decision:
          type: string
          enum: [approve, reject]
        note:
