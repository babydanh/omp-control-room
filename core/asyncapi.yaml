      additionalProperties: false
      required: [type, answer]
      properties:
        type:
          const: companyQuestionAnswer
        answer:
          $ref: '#/components/schemas/QuestionAnswerInput'

    CompanySessionControlMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, sessionId, runEpoch, action]
      properties:
        type:
          const: companySessionControl
        requestId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        runEpoch:
          type: integer
          minimum: 0
        action:
          type: string
          enum: [pause, resume, kill, restart, archive, interrupt, delete]

    CompanyChatNewMessage:
      type: object
      additionalProperties: false
      required: [type, requestId]
      description: >-
        Open a new omp chat session in the workspace folder. Its process starts in a terminal the
        board can show at once; no prompt is sent. The command result carries the new session id.
      properties:
        type:
          const: companyChatNew
        requestId:
          type: string
          format: uuid
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
          description: Folder to create the chat in. Required when the server runs several folders.

    CompanyFolderBrowseRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId]
      description: >-
        List one folder's sub-folders for the folder browser. Without a path the answer is the
        start view: the drives (or the root) and the home folder. A refusal is a
        companyCommandResult under the same requestId.
      properties:
        type:
          const: companyFolderBrowseRequest
        requestId:
          type: string
          format: uuid
        path:
          type: string
          minLength: 1
          maxLength: 4096
          description: An absolute folder path. A path with a parent segment is refused.

    CompanyFolderCreateMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, parentPath, name]
      description: >-
        Create one new folder inside an existing folder. The name is one path segment and must not
        already exist. The verdict names the new folder through workspacePath.
      properties:
        type:
          const: companyFolderCreate
        requestId:
          type: string
          format: uuid
        parentPath:
          type: string
          minLength: 1
          maxLength: 4096
        name:
          type: string
          minLength: 1
          maxLength: 255

    CompanyFolderNameMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, path, name]
      description: >-
        Give a folder a display name, kept in the pixel-agents config and keyed by the folder's
        canonical path. An empty name removes it, so the folder shows its own name again.
      properties:
        type:
          const: companyFolderName
        requestId:
          type: string
          format: uuid
        path:
          type: string
          minLength: 1
          maxLength: 4096
        name:
          type: string
          maxLength: 80

    CompanyFolderForgetMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, path]
      description: >-
        Take a folder off the folder list. Its recent entry is dropped and, when it is open, its Company is stopped.
        Refused while that folder has working or waiting sessions. The path is taken as listed, so a folder that is
        already gone can still be removed from the list.
      properties:
        type:
          const: companyFolderForget
        requestId:
          type: string
          format: uuid
        path:
          type: string
          minLength: 1
          maxLength: 4096

    WorkItemStatus:
      type: string
      enum: [queued, running, needs_input, review, done, failed]
      description: >-
        queued waits for its agent to be free. running was sent and the agent is working. needs_input
        means the agent is blocked on a question. review means the agent stopped after working, so the
        user should look. done and failed are verdicts: the user's own, or the server's when delivery
        failed or the agent vanished.

    WorkItemAssigneeKind:
      type: string
      enum: [herdr, session, new-session, auto, claude, agy]

    WorkItemAssignee:
      type: object
      additionalProperties: false
      required: [kind]
      description: >-
        Who a work item goes to. herdr names a herdr pane by paneId. session names an omp session on
        the board by sessionId. new-session opens a fresh omp chat in the item's repo when the item is
        sent. claude runs the item as one Claude Code run (claude -p) in the item's worktree, or in its repo
        when read-only; agy runs one Antigravity CLI run (agy, prompt on stdin) in the item's worktree or repo when read-only.
        auto lets the scheduler pick an idle member in the item's repo, or open one, or start a CLI run, when the item is sent, and the item then takes the concrete assignee.
      properties:
        kind:
          $ref: '#/components/schemas/WorkItemAssigneeKind'
        paneId:
          type: string
          minLength: 1
          maxLength: 128
        sessionId:
          type: string
          format: uuid

    WorkItemEventKind:
      type: string
      enum: [created, assigned, queued, dispatched, followed_up, status, note]

    WorkItemEvent:
      type: object
      additionalProperties: false
      required: [at, kind]
      properties:
        at:
          type: string
          format: date-time
        kind:
          $ref: '#/components/schemas/WorkItemEventKind'
        message:
          type: string
          maxLength: 2000

    WorkItemPriority:
      type: integer
      minimum: 0
      maximum: 3
      description: >-
        P0 is the most urgent, P3 the least. A queued item for one agent is sent by priority first, then by creation order.

    WorkItemBlockerKind:
      type: string
      enum: [agent, dependency, failed, capacity, area, no_member, busy_checkout, pool_full, repo_full, worktree]

    WorkItemBlocker:
      type: object
      additionalProperties: false
      required: [kind]
      description: >-
        Why a queued item is not sent yet, shown as a chip. agent: its agent is busy. dependency: a dependency is
        not done yet. failed: a dependency failed or was removed. capacity: the folder has no free slot; running and
        limit give the count. area: a running item holds an area or checkout this one needs; sequence is that
        item's #n and area names it. no_member: no free agent in the item's repo, and the squad cannot open one;
        the reason sentence says why. busy_checkout: an agent outside the work items is working in the checkout
        this item needs; area names the checkout. pool_full: the omp runner pool has no free slot; the item retries
        on its own. repo_full: the repo has reached its running-item limit; running and limit give the count and area
        names the repo. worktree: the squad could not create the isolated worktree for this item; detail says why.
      properties:
        kind:
          $ref: '#/components/schemas/WorkItemBlockerKind'
        sequence:
          type: integer
          minimum: 0
        area:
          type: string
          maxLength: 300
        running:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 0
        detail:
          type: string
          maxLength: 300
    WorkItem:
      type: object
      additionalProperties: false
      required: [id, text, assignee, status, sequence, createdAt, updatedAt, history, priority, dependsOn]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        assignee:
          $ref: '#/components/schemas/WorkItemAssignee'
        status:
          $ref: '#/components/schemas/WorkItemStatus'
        sequence:
          type: integer
          minimum: 0
          description: Creation order in this folder. Queued items for one agent are sent in this order.
        reason:
          type: string
          maxLength: 2000
          description: Why the item waits, needs input, or failed, as one Vietnamese sentence the board shows.
        result:
          type: string
          maxLength: 8192
          description: The last lines of the agent's screen when it stopped, so the user can check the work.
        priority:
          $ref: '#/components/schemas/WorkItemPriority'
        acceptance:
          type: string
          maxLength: 1000
          description: >-
            What done looks like. The agent gets it after the text, as a last line starting with "Xong khi", and
            the card shows it apart from the text.
        dependsOn:
          type: array
          maxItems: 10
          description: Items this one waits for, by id in this folder. It is sent only once every one of them is done.
          items:
            type: string
            format: uuid
        repo:
          type: string
          minLength: 1
          maxLength: 4096
          description: >-
            Canonical path of the repo or checkout the item works in. Absent means the Company folder root.
        role:
          $ref: '#/components/schemas/CompanyRole'
        areas:
          type: array
          maxItems: 8
          description: >-
            Code areas this item edits, lowercase, such as web:src/app. Two running items may not share an
            area. Read-only agents take none.
          items:
            type: string
            minLength: 1
            maxLength: 120
        agent:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Name of the omp subagent that does the item, such as task, reviewer, or a custom agent. Absent
            means the default worker.
        worktree:
          type: object
          additionalProperties: false
          required: [path, branch]
          description: >-
            The isolated git worktree the squad created for this editing item, and its branch. Absent for read-only
            items and for items that have not started yet. The squad removes it when the item is cleaned up.
          properties:
            path:
              type: string
              minLength: 1
              maxLength: 4096
            branch:
              type: string
              minLength: 1
              maxLength: 256
        claudeRun:
          $ref: '#/components/schemas/WorkItemClaudeRun'
        agyRun:
          $ref: '#/components/schemas/WorkItemAgyRun'
        judge:
          $ref: '#/components/schemas/WorkItemJudge'
        conflicts:
          $ref: '#/components/schemas/WorkItemConflicts'
        worktreeRemoved:
          type: boolean
          description: True once Dọn worktree removed this item's worktree. Absent otherwise.
        blocker:
          $ref: '#/components/schemas/WorkItemBlocker'
        squadRunId:
          type: string
          format: uuid
          description: The squad proposal whose approval created this item. Absent for items the user made by hand.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        dispatchedAt:
          type: string
          format: date-time
        history:
          type: array
          items:
            $ref: '#/components/schemas/WorkItemEvent'

    WorkItemJudgeVerdict:
      type: string
      enum: [pass, fail, need_evidence]

    WorkItemClaudeRun:
      type: object
      additionalProperties: false
      required: [mode, startedAt]
      description: >-
        The Claude Code run (claude -p) this item is in. While it runs, progress is the latest assistant text or
        the name of the tool it uses. interrupted: the board restarted during the run; Gửi tiếp resumes the same
        session in the same checkout.
      properties:
        mode:
          type: string
          enum: [edit, read]
        startedAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        progress:
          type: string
          maxLength: 300
        interrupted:
          type: boolean

    WorkItemAgyRun:
      type: object
      additionalProperties: false
      required: [mode, startedAt]
      description: >-
        The Antigravity CLI run (agy, prompt on stdin) this item is in. While it runs, progress is its latest assistant text.
        interrupted means the board restarted during the run; the item can be retried in the same checkout.
      properties:
        mode:
          type: string
          enum: [edit, read]
        startedAt:
          type: string
          format: date-time
        pid:
          type: integer
          minimum: 1
        progress:
          type: string
          maxLength: 300
        interrupted:
          type: boolean
        conversationId:
          type: string
          maxLength: 128
          description: >-
            The agy conversation the run opened. A follow-up continues it (`agy --conversation <id>`),
            so the agent keeps the task it worked on instead of getting the follow-up text alone.

    WorkItemJudge:
      type: object
      additionalProperties: false
      required: [status, followUps]
      description: >-
        The judge's state for an item in review. running: a judge turn is in flight. waiting: the judge holds the
        item until its open conflicts clear. verdict: the last verdict, with its reason. interrupted: the server
        stopped during a turn, and Chấm lại runs it again. error: the judge turn failed; error says why, and nothing
        is sent to the agent.
      properties:
        status:
          type: string
          enum: [running, waiting, verdict, interrupted, error]
        verdict:
          $ref: '#/components/schemas/WorkItemJudgeVerdict'
        reason:
          type: string
          maxLength: 2000
        error:
          type: string
          maxLength: 300
        followUps:
          type: integer
          minimum: 0
          maximum: 2
          description: Judge-driven follow-ups sent so far. At most 2.


    WorkItemConflicts:
      type: object
      additionalProperties: false
      required: [sequences, main]
      description: >-
        Open overlaps the ledger reports for this item's checkout: the #n of each other open item it overlaps, and
        whether it overlaps the main checkout's dirty files. Empty means none.
      properties:
        sequences:
          type: array
          maxItems: 20
          items:
            type: integer
            minimum: 0
        main:
          type: boolean

    AgentRole:
      type: object
      additionalProperties: false
      required: [agent, description, updatedAt]
      description: A user-written note on what one herdr pane or omp session is for. Phase 2 reads these.
      properties:
        agent:
          $ref: '#/components/schemas/WorkItemAssignee'
        description:
          type: string
          maxLength: 1000
        updatedAt:
          type: string
          format: date-time

    SquadSettings:
      type: object
      additionalProperties: false
      required: [maxParallel, maxSquadSessions, minFreeRamGb, autoJudge, autoApproveNext, compactSquad, engineLeader, engineJudge, engineWorker, claudeModelLeader, claudeModelJudge, maxClaudeRuns, maxAgyRuns, claudeMaxTurns, claudeMaxBudgetUsd, claudePermission, claudeAllowedTools, claudeWorkerMcp]
      description: >-
        Per-folder limits and CLI choices for the squad scheduler. maxParallel caps running work items in the folder.
        maxPerRepo caps running work items in one repo. maxSquadSessions caps the omp sessions the squad opens.
        minFreeRamGb is the free memory needed before opening one. engineLeader, engineJudge, and engineWorker select
        a CLI independently for leader, judge, and automatic worker runs. All three default to omp. autoJudge is read
        by the judge in a later phase. autoApproveNext approves a leader's proposal by itself, the first one of a run
        included, when it has no completeness warning.
      properties:
        maxParallel:
          type: integer
          minimum: 1
          maximum: 24
        maxSquadSessions:
          type: integer
          minimum: 0
          maximum: 24
        maxPerRepo:
          type: integer
          minimum: 1
          maximum: 8
        minFreeRamGb:
          type: number
          minimum: 0
          maximum: 256
        autoJudge:
          type: boolean
        autoApproveNext:
          type: boolean
        compactSquad:
          type: boolean
          description: Mỗi repo một phiên, không chấm từng thẻ, hỏi người dùng một lần khi xong.
        engineLeader:
          type: string
          enum: [omp, claude, agy]
          description: CLI used for squad leader turns. Defaults to omp.
        engineJudge:
          type: string
          enum: [omp, claude, agy]
          description: CLI used for squad judge turns. Defaults to omp.
        engineWorker:
          type: string
          enum: [omp, claude, agy]
          description: CLI preferred for automatic worker runs when a suitable idle omp agent is unavailable. Defaults to omp.
        claudeModelLeader:
          type: string
          minLength: 1
          maxLength: 64
        claudeModelJudge:
          type: string
          minLength: 1
          maxLength: 64
        maxClaudeRuns:
          type: integer
          minimum: 1
          maximum: 4
        maxAgyRuns:
          type: integer
          minimum: 1
          maximum: 4
          description: Maximum number of concurrent Antigravity CLI worker runs.
        claudeMaxTurns:
          type: integer
          minimum: 1
          maximum: 200
        claudeMaxBudgetUsd:
          type: number
          minimum: 0.1
          maximum: 50
        claudePermission:
          type: string
          enum: [auto, acceptEdits]
          description: >-
            Permission mode of an editing Claude Code run. auto lets the classifier approve safe actions and block
            risky ones; acceptEdits approves file edits only. Read-only runs always plan.
        claudeAllowedTools:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 120
            pattern: '^[A-Za-z][A-Za-z0-9_]*(\([^()\n]*\))?$'
          description: >-
            Tool patterns an editing Claude Code run may use without asking, passed as --allowedTools, such as
            Bash(git status*). Read-only runs get none.
        claudeWorkerMcp:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: >-
            Names of the MCP servers a Claude Code worker run loads, copied from the user's Claude config. Every
            other server is left out of the run. Empty by default, so a worker run loads no MCP server.

    ClaudeCodeStatus:
      type: object
      additionalProperties: false
      required: [state]
      description: >-
        The Claude Code CLI on this machine, as the board last checked it with claude auth status. unknown: not
        checked yet. missing: the claude command is not on PATH. signed_out: installed but not logged in. signed_in:
        logged in through a Claude subscription. The check never reads or shows credentials.
      properties:
        state:
          type: string
          enum: [unknown, missing, signed_out, signed_in]
        checkedAt:
          type: string
          format: date-time

    OmpAgentInfo:
      type: object
      additionalProperties: false
      required: [name, description, readOnly, source]
      description: >-
        An omp subagent a work item can name. A readOnly agent takes no area or checkout locks.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 1000
        readOnly:
          type: boolean
        source:
          type: string
          enum: [bundled, user, project]

    CompanyWorkItemsMessage:
      type: object
      additionalProperties: false
      required: [type, workspacePath, revision, items, roles, settings, repos, agents, claudeMcpServers]
      description: >-
        One folder's work items and agent role notes, sent in full after every change to them and in
        answer to a snapshot request. A message replaces the folder's earlier one when its revision is newer.
      properties:
        type:
          const: companyWorkItems
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        revision:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkItem'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AgentRole'
        settings:
          $ref: '#/components/schemas/SquadSettings'
        claudeStatus:
          $ref: '#/components/schemas/ClaudeCodeStatus'
        claudeMcpServers:
          type: array
          maxItems: 200
          description: >-
            Names of the MCP servers the user's Claude config defines at the top level and for this folder's
            paths. The squad settings list them as chips. Names only: server entries never leave the server.
          items:
            type: string
            minLength: 1
            maxLength: 64
        parkedSessionIds:
          type: array
          maxItems: 200
          description: >-
            Squad-opened omp sessions the squad parked for being idle. The board shows a parked badge on each.
          items:
            type: string
            minLength: 1
            maxLength: 4096
        repos:
          type: array
          maxItems: 200
          description: >-
            Git repos and worktrees under the folder, as canonical paths, for the Repo choice.
          items:
            type: string
            minLength: 1
            maxLength: 4096
        agents:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/OmpAgentInfo'

    CompanyWorkItemCreateMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, workspacePath, text, assignee]
      description: >-
        Create one work item for an assignee and send it, or queue it while the assignee is busy. The same
        requestId twice creates nothing new. Refused when the herdr pane is not in the roster.
      properties:
        type:
          const: companyWorkItemCreate
        requestId:
          type: string
          format: uuid
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        text:
          type: string
          minLength: 1
        assignee:
          $ref: '#/components/schemas/WorkItemAssignee'
        priority:
          $ref: '#/components/schemas/WorkItemPriority'
        acceptance:
          type: string
          maxLength: 1000
        dependsOn:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
        repo:
          type: string
          minLength: 1
          maxLength: 4096
          description: >-
            Canonical path of the repo or checkout the item works in. Absent means the Company folder root.
        role:
          $ref: '#/components/schemas/CompanyRole'
        areas:
          type: array
          maxItems: 8
          description: >-
            Code areas this item edits, lowercase, such as web:src/app. Two running items may not share an
            area. Read-only agents take none.
          items:
            type: string
            minLength: 1
            maxLength: 120
        agent:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Name of the omp subagent that does the item, such as task, reviewer, or a custom agent. Absent
            means the default worker.

    CompanyWorkItemAssignMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, workspacePath, id, assignee]
      description: >-
        Give an existing work item to another assignee and send it, or queue it there. Refused while the item
        is running or needs input, because its current assignee is still working on it.
      properties:
        type:
          const: companyWorkItemAssign
        requestId:
          type: string
          format: uuid
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        id:
          type: string
          format: uuid
        assignee:
          $ref: '#/components/schemas/WorkItemAssignee'
        repo:
          type: string
          minLength: 1
          maxLength: 4096
          description: >-
            Canonical path of the repo the item moves to. Absent clears it, so the item runs in the folder root.
        role:
          $ref: '#/components/schemas/CompanyRole'
        areas:
          type: array
          maxItems: 8
          description: >-
            Code areas the item edits, lowercase. Absent clears them. Each assign sends the full set of fields.
          items:
            type: string
            minLength: 1
            maxLength: 120
        agent:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Omp subagent name. Absent clears it and the item uses the default worker.

    CompanyWorkItemFollowUpMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, workspacePath, id, text]
      description: >-
        Send one more prompt to the item's current assignee, queued when it is busy. Only for items in review or
        failed; the item runs again.
      properties:
        type:
          const: companyWorkItemFollowUp
        requestId:
          type: string
          format: uuid
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1

    WorkItemVerdict:
      type: string
      enum: [done, failed]

    CompanyWorkItemMarkMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, workspacePath, id, verdict]
      description: 'The user verdict on an item: done (Xong) or failed (Hỏng). Never sends anything to an agent.'
      properties:
        type:
          const: companyWorkItemMark
        requestId:
          type: string
          format: uuid
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        id:
          type: string
          format: uuid
        verdict:
          $ref: '#/components/schemas/WorkItemVerdict'

    CompanyWorkItemCancelMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, workspacePath, id]
      description: Remove a queued item that was never sent. Refused for any other status.
      properties:
        type:
          const: companyWorkItemCancel
        requestId:
          type: string
          format: uuid
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        id:
          type: string
          format: uuid

    CompanyWorkItemDependenciesMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, workspacePath, id, dependsOn]
      description: >-
        Replace the list of items a queued item waits for. An empty list clears it. Refused for any other status, for
        an item that would wait on itself or close a loop, and for more than 10 items.
      properties:
        type:
          const: companyWorkItemDependencies
        requestId:
          type: string
          format: uuid
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        id:
          type: string
          format: uuid
        dependsOn:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid

    CompanyWorkItemJudgeMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, workspacePath, id]
      description: >-
        Run the judge again on an item in review: after a judge turn was interrupted or failed, or once its
        conflicts cleared. Refused for any other status.
      properties:
        type:
          const: companyWorkItemJudge
        requestId:
          type: string
          format: uuid
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        id:
          type: string
          format: uuid

    CompanyWorkItemCleanWorktreeMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, workspacePath, id]
      description: >-
        Remove the isolated worktree of a done item. Refused unless it has no uncommitted changes and its branch is
        merged into origin/main. Never forced, and it never touches another item's checkout.
      properties:
        type:
          const: companyWorkItemCleanWorktree
        requestId:
          type: string
          format: uuid
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        id:
          type: string
          format: uuid


    CompanyAgentRoleSetMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, workspacePath, agent, description]
      description: >-
        Save the role note for a herdr pane or an omp session. An empty description clears the note.
        A new-session assignee is refused.
      properties:
        type:
          const: companyAgentRoleSet
        requestId:
          type: string
          format: uuid
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        agent:
          $ref: '#/components/schemas/WorkItemAssignee'
        description:
          type: string
          maxLength: 1000

    CompanySquadSettingsSetMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, workspacePath, settings]
      description: >-
        Save the folder's squad settings. The same requestId twice saves nothing new.
      properties:
        type:
          const: companySquadSettingsSet
        requestId:
          type: string
          format: uuid
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        settings:
          $ref: '#/components/schemas/SquadSettings'

    SquadRunStatus:
      type: string
      enum: [planning, proposed, working, done, dismissed, failed, stopped]
      description: >-
        planning: the leader turn is in flight. proposed: a proposal waits for the user to approve or dismiss it.
        working: approved items are out and the leader waits for their results. done: the leader says the squad is
        finished. dismissed: the user dropped the proposal. failed: the last leader turn gave no usable reply, and
        Thử lại runs it again. stopped: the run reached its turn cap and sends nothing more.

    SquadEventKind:
      type: string
      enum: [request, turn, proposal, approved, review, done, dismissed, failed, stopped]

    SquadEvent:
      type: object
      additionalProperties: false
      required: [at, kind]
      properties:
        at:
          type: string
          format: date-time
        kind:
          $ref: '#/components/schemas/SquadEventKind'
        message:
          type: string
          maxLength: 4000

    SquadDependency:
      type: object
      additionalProperties: false
      required: [kind]
      description: >-
        One thing a row waits for. kind row names another row of the same proposal by its 0-based index in rows; kind
        item names an open work item of the folder by its sequence (#n).
      properties:
        kind:
          type: string
          enum: [row, item]
        row:
          type: integer
          minimum: 0
          maximum: 7
        sequence:
          type: integer
          minimum: 0

    SquadRowInput:
      type: object
      additionalProperties: false
      required: [text, assignee]
      description: >-
        One assignment the user approves: the prompt to send and who gets it. Edited rows are sent as the user
        left them, not as the leader wrote them.
      properties:
        text:
          type: string
          minLength: 1
        assignee:
          $ref: '#/components/schemas/WorkItemAssignee'
        priority:
          $ref: '#/components/schemas/WorkItemPriority'
        acceptance:
          type: string
          maxLength: 1000
        dependsOn:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/SquadDependency'
        repo:
          type: string
          minLength: 1
          maxLength: 4096
          description: >-
            Canonical path of the repo or checkout the row works in. Absent means the Company folder root.
        role:
          $ref: '#/components/schemas/CompanyRole'
        agent:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Name of the omp subagent that does the row, such as scout, task, or reviewer. Absent means the default
            worker.
        areas:
          type: array
          maxItems: 8
          description: Code areas the row edits, lowercase, such as web:src/app. Read-only agents take none.
          items:
            type: string
            minLength: 1
            maxLength: 120

    SquadRow:
      type: object
      additionalProperties: false
      required: [text, assignee, priority, dependsOn]
      description: One proposed assignment as the leader wrote it. reason says why the leader chose this assignee.
      properties:
        text:
          type: string
          minLength: 1
        assignee:
          $ref: '#/components/schemas/WorkItemAssignee'
        reason:
          type: string
          maxLength: 500
        priority:
          $ref: '#/components/schemas/WorkItemPriority'
        acceptance:
          type: string
          maxLength: 1000
        dependsOn:
          type: array
          maxItems: 10
          description: >-
            What this row waits for. Row indexes are 0-based positions in this proposal. Items are their #n.
          items:
            $ref: '#/components/schemas/SquadDependency'
        repo:
          type: string
          minLength: 1
          maxLength: 4096
          description: >-
            Canonical path of the repo or checkout the row works in. Absent means the Company folder root.
        role:
          $ref: '#/components/schemas/CompanyRole'
        agent:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Name of the omp subagent that does the row, such as scout, task, or reviewer. Absent means the default
            worker.
        areas:
          type: array
          maxItems: 8
          description: Code areas the row edits, lowercase, such as web:src/app. Read-only agents take none.
          items:
            type: string
            minLength: 1
            maxLength: 120

    SquadProposalStatus:
      type: string
      enum: [pending, approved, dismissed]

    SquadProposal:
      type: object
      additionalProperties: false
      required: [id, turn, note, rows, warnings, status, createdAt]
      description: >-
        One leader reply that assigns work. id is the squadRunId that the approved items carry. rows is what the
        leader proposed, before any edit by the user.
      properties:
        id:
          type: string
          format: uuid
        turn:
          type: integer
          minimum: 1
        note:
          type: string
          maxLength: 2000
        rows:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/SquadRow'
        warnings:
          type: array
          maxItems: 20
          description: >-
            Completeness notes the server reads from the rows: a missing review, a missing security review, or a
            missing acceptance. They show as chips on the proposal and never block approval.
          items:
            type: string
            minLength: 1
            maxLength: 300
        status:
          $ref: '#/components/schemas/SquadProposalStatus'
        createdAt:
          type: string
          format: date-time

    SquadProgress:
      type: object
      additionalProperties: false
      required: [done, total]
      description: Work items the run's approved proposals created, and how many of them are done.
      properties:
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0

    SquadRun:
      type: object
      additionalProperties: false
      required: [id, request, status, turns, maxTurns, progress, history, createdAt, updatedAt]
      description: >-
        One Giao cho đội request and the leader turns it caused. proposal is the newest proposal, whatever its
        status.
      properties:
        id:
          type: string
          format: uuid
        request:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/SquadRunStatus'
        turns:
          type: integer
          minimum: 0
        maxTurns:
          type: integer
          minimum: 1
        proposal:
          $ref: '#/components/schemas/SquadProposal'
        progress:
          $ref: '#/components/schemas/SquadProgress'
        note:
          type: string
          maxLength: 4000
          description: The leader's closing note once the squad is done.
        compact:
          type: boolean
          description: Run này dùng chế độ gọn. Run cũ thiếu trường này được hiểu là không gọn.
        closed:
          type: boolean
          description: Người dùng đã đọc và đóng bản tổng kết của run chế độ gọn.
        proposalIds:
          type: array
          description: Proposal IDs for compact-run child items, so the board can hide and group every task across turns.
          items:
            type: string
            format: uuid
        error:
          type: string
          maxLength: 2000
          description: Why the last leader turn gave no usable reply, shown with Thử lại.
        history:
          type: array
          maxItems: 60
          items:
            $ref: '#/components/schemas/SquadEvent'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CompanySquadMessage:
      type: object
      additionalProperties: false
      required: [type, workspacePath, revision, runs]
      description: >-
        One folder's squad runs, sent in full after every change to them and in answer to a snapshot request.
        A message replaces the folder's earlier one when its revision is newer.
      properties:
        type:
          const: companySquad
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        revision:
          type: integer
          minimum: 0
        runs:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SquadRun'

    SquadLeaderLive:
      type: object
      additionalProperties: false
      required: [phase, chars, startedAt]
      description: >-
        What the leader's running turn has produced so far. thinking counts the model's reasoning without
        showing it; writing carries the tail of the answer it is writing (the proposal JSON).
      properties:
        phase:
          type: string
          enum: [thinking, writing]
        chars:
          type: integer
          minimum: 0
          description: Characters produced in this phase so far.
        text:
          type: string
          maxLength: 2000
          description: The last characters of the answer, while writing.
        startedAt:
          type: string
          format: date-time

    CompanySquadLiveMessage:
      type: object
      additionalProperties: false
      required: [type, workspacePath, runId]
      description: >-
        A leader turn's progress, sent about once a second while it runs and once without live when it
        ends. Not stored: the run itself arrives in companySquad.
      properties:
        type:
          const: companySquadLive
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        runId:
          type: string
          format: uuid
        live:
          $ref: '#/components/schemas/SquadLeaderLive'

    CompanySquadRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, workspacePath]
      description: >-
        Start a squad run: one leader turn proposes assignments for the folder's team. Nothing reaches any agent
        until the user approves a proposal. The same requestId twice starts nothing new.
      properties:
        type:
          const: companySquadRequest
        requestId:
          type: string
          format: uuid
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        text:
          type: string
          minLength: 1
        fromWorkItemId:
          type: string
          format: uuid
          description: A review item of this folder, for "Hỏi đội trưởng bước tiếp". The leader reads its text, acceptance and result, so text is not sent with it.

    CompanySquadApproveMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, workspacePath, runId, proposalId, rows]
      description: >-
        Approve a pending proposal with the rows as the user edited them. Creates one work item per row, each
        carrying the proposal id as squadRunId, and sends them. A resent requestId, or a second approval of an
        approved proposal, creates nothing new.
      properties:
        type:
          const: companySquadApprove
        requestId:
          type: string
          format: uuid
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        runId:
          type: string
          format: uuid
        proposalId:
          type: string
          format: uuid
        rows:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/SquadRowInput'

    CompanySquadDismissMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, workspacePath, runId, proposalId]
      description: Drop a pending proposal. Nothing is created or sent, and the run stops asking the leader.
      properties:
        type:
          const: companySquadDismiss
        requestId:
          type: string
          format: uuid
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        runId:
          type: string
          format: uuid
        proposalId:
          type: string
          format: uuid

    CompanySquadRetryMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, workspacePath, runId]
