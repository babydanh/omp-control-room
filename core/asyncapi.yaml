      properties:
        type:
          const: companySquadRetry
        requestId:
          type: string
          format: uuid
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        runId:
          type: string
          format: uuid

    CompanySquadCancelMessage:
      type: object
