        type:
          const: companySquadCancel
        requestId:
          type: string
          format: uuid
        workspacePath:
          type: string
          minLength: 1
          maxLength: 4096
        runId:
          type: string
          format: uuid

    CompanySquadReplyMessage:
      type: object
