          type: string
          maxLength: 12000
        content:
          type: string
          minLength: 1
          maxLength: 4000
        receivingSessionId:
          type: string
          minLength: 1
          maxLength: 256

    ProjectSettingsRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId]
      properties:
        type:
          const: projectSettingsRequest
        requestId:
          type: string
          format: uuid
        nodeId:
          type: string
          minLength: 1
          maxLength: 1024

    ProjectSettingsSetMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, scope, nodeId, field, value]
      properties:
        type:
          const: projectSettingsSet
        requestId:
          type: string
          format: uuid
        scope:
          type: string
          enum: [project, folder]
        nodeId:
          type: string
          minLength: 1
          maxLength: 1024
        field:
          $ref: '#/components/schemas/ProjectSettingField'
        value:
          $ref: '#/components/schemas/ProjectSettingValue'

    ProjectSettingsClearMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, scope, nodeId, field]
      properties:
        type:
          const: projectSettingsClear
        requestId:
          type: string
          format: uuid
        scope:
          type: string
          enum: [project, folder]
        nodeId:
          type: string
          minLength: 1
          maxLength: 1024
        field:
          $ref: '#/components/schemas/ProjectSettingField'

    ProjectSessionStopMessage:
      type: object
      additionalProperties: false
      description: >-
        Stops a live ledger session the Project tree lists: its process and the processes it
        started end. A subagent cannot be stopped alone (it shares its parent's process).
      required: [type, requestId, sessionId]
      properties:
        type:
          const: projectSessionStop
        requestId:
          type: string
          format: uuid
        sessionId:
          type: string
          minLength: 1
          maxLength: 256

    ProjectImageSaveMessage:
      type: object
      additionalProperties: false
      description: >-
        Saves an image pasted or dropped into the prompt box under
        ~/.pixel-agents/attachments, so the text sent to an agent can name its path:
        a terminal carries text, and agents read an image from its path.
      required: [type, requestId, fileName, mediaType, dataBase64]
      properties:
        type:
          const: projectImageSave
        requestId:
          type: string
          format: uuid
        fileName:
          type: string
          maxLength: 512
        mediaType:
          type: string
          enum: [image/png, image/jpeg, image/gif, image/webp]
        dataBase64:
          type: string
          maxLength: 13981016

    ProjectImageSavedMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, path]
      properties:
        type:
          const: projectImageSaved
        requestId:
          type: string
          format: uuid
        path:
          type: string
          description: Absolute path of the saved image.

    ProjectSessionStartMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, nodeId, engine, worktree, taskName, initialPrompt]
      properties:
        type:
          const: projectSessionStart
        requestId:
          type: string
          format: uuid
        nodeId:
          type: string
          minLength: 1
          maxLength: 1024
        engine:
          type: string
          enum: [omp, claude, agy]
        worktree:
          type: string
          enum: [separate, shared]
        taskName:
          type: string
          minLength: 1
          maxLength: 256
        initialPrompt:
          description: Empty for an omp chat the user types into; Claude and agy need it as their task.
          type: string
          maxLength: 12000

    ProjectTreeSnapshotMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, nodes]
      properties:
        type:
          const: projectTreeSnapshot
        requestId:
          type: string
          format: uuid
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ProjectTreeNode'
        partial:
          type: boolean
          description: >-
            True for the quick folders-and-sessions snapshot sent before the git scan ends:
            repos, worktrees and files are not known yet. The full snapshot follows.

    ProjectDiffMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, checkout, scope, sha, files, truncated]
      properties:
        type:
          const: projectDiff
        requestId:
          type: string
          format: uuid
        checkout:
          type: string
        scope:
          type: string
          enum: [uncommitted, branch, commit, compare]
        sha:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/ProjectDiffFile'
        truncated:
          type: boolean
        reason:
          type: string
          description: Vietnamese refusal or failure reason.

    ProjectSettingsMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, values, sources]
      properties:
        type:
          const: projectSettings
        requestId:
          type: string
          format: uuid
        nodeId:
          type: string
        values:
          $ref: '#/components/schemas/ProjectSettingsValues'
        sources:
          $ref: '#/components/schemas/ProjectSettingsSources'

    ProjectCommandResultMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, command, ok]
      properties:
        type:
          const: projectCommandResult
        requestId:
          type: string
          format: uuid
        command:
          type: string
          enum: [create, update, delete, move, comment, settingsSet, settingsClear, stop, imageSave]
        ok:
          type: boolean
        nodeId:
          type: string
        reason:
          type: string
          description: Vietnamese refusal or failure reason.

    ProjectSessionStartResultMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, ok]
      properties:
        type:
          const: projectSessionStartResult
        requestId:
          type: string
          format: uuid
        ok:
          type: boolean
        sessionId:
          type: string
        checkout:
          type: string
        reason:
          type: string
          description: Vietnamese refusal or failure reason.

    ProjectTreeNode:
      type: object
      additionalProperties: false
      required: [id, kind, name]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 1024
        parentId:
          type: string
          minLength: 1
          maxLength: 1024
        kind:
          type: string
          enum: [project, folder, group, repository, checkout, file-agg, session]
        name:
          type: string
        path:
          type: string
        engine:
          type: string
          enum: [omp, claude, agy, herdr, board]
        agentKind:
          type: string
          enum: [omp, sub, claude, agy, herdr, board]
        branch:
          type: string
        sessionId:
          type: string
        boardSessionId:
          type: string
          description: >-
            Session rows: the board session behind this omp session, when one of the open
            folders runs it. Clicking the row opens that board session.
        parentSessionId:
          type: string
          description: >-
            Session rows: the session that spawned this one (a subagent's main session), when
            the ledger links them. The sidebar nests the row under that session.
        herdrPaneId:
          type: string
          description: >-
            Session rows: the herdr pane the session runs in, when herdr reports the same
            session. Clicking the row opens that pane's terminal.
        editCheckouts:
          type: array
          items:
            type: string
          description: >-
            Session rows: the checkouts the session edited in the last few hours, newest
            first, from the ledger. A session at a folder's root works across repos; its
            changes open in the newest of these that has uncommitted lines.
        progress:
          type: object
          additionalProperties: false
          required: [done, total]
          description: >-
            Session rows: the agent's own todo list as its transcript last wrote it (omp todo,
            Claude Code TodoWrite). Absent when the agent kept no todo list. It is what the
            agent says, not a check of the work.
          properties:
            done:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 1
            current:
              type: string
              maxLength: 400
              description: The task in progress, or else the next pending one.
            blocked:
              type: string
              maxLength: 800
              description: The first blocked task and its reason, joined by a colon.
        state:
          type: string
        title:
          type: string
        color:
          type: string
        dirty:
          type: boolean
        ahead:
          type: integer
          minimum: 0
        behind:
          type: integer
          minimum: 0
        additions:
          type: integer
          minimum: 0
        deletions:
          type: integer
          minimum: 0
        overlap:
          type: boolean
        overlappingWorktrees:
          type: array
          items:
            type: string
        pendingWork:
          type: boolean
    ProjectMergePreviewRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, repo, branchA, branchB]
      properties:
        type:
          const: projectMergePreviewRequest
        requestId:
          type: string
          format: uuid
        repo:
          type: string
          minLength: 1
          maxLength: 4096
        branchA:
          type: string
          minLength: 1
          maxLength: 256
        branchB:
          type: string
          minLength: 1
          maxLength: 256

    ProjectMergePreviewResultMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, repo, branchA, branchB, clean, conflicts]
      properties:
        type:
          const: projectMergePreviewResult
        requestId:
          type: string
          format: uuid
        repo:
          type: string
        branchA:
          type: string
        branchB:
          type: string
        clean:
          type: boolean
        conflicts:
          type: array
          items:
            type: string
        reason:
          type: string
          description: Vietnamese refusal or failure reason.

    ProjectBranchCompareRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, repo, branchA, branchB]
      properties:
        type:
          const: projectBranchCompareRequest
        requestId:
          type: string
          format: uuid
        repo:
          type: string
          minLength: 1
          maxLength: 4096
        branchA:
          type: string
          minLength: 1
          maxLength: 256
        branchB:
          type: string
          minLength: 1
          maxLength: 256

    ProjectBranchCompareMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, repo, branchA, branchB, a, b, mergeBase, onlyA, onlyB, commitsTruncated, files, mergeClean, conflicts]
      properties:
        type:
          const: projectBranchCompare
        requestId:
          type: string
          format: uuid
        repo:
          type: string
        branchA:
          type: string
        branchB:
          type: string
        a:
          $ref: '#/components/schemas/ProjectBranchCompareSide'
        b:
          $ref: '#/components/schemas/ProjectBranchCompareSide'
        mergeBase:
          type: [string, 'null']
        onlyA:
          type: array
          items:
            $ref: '#/components/schemas/ProjectBranchCommit'
        onlyB:
          type: array
          items:
            $ref: '#/components/schemas/ProjectBranchCommit'
        commitsTruncated:
          type: boolean
        files:
          type: array
          items:
            $ref: '#/components/schemas/ProjectBranchCompareFile'
        mergeClean:
          type: boolean
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ProjectBranchCompareConflict'
        reason:
          type: string

    ProjectBranchCompareSide:
      type: object
      additionalProperties: false
      required: [branch, head, lastCommitAt, lastCommitSubject, dirtyFiles]
      properties:
        branch:
          type: string
        head:
          type: string
        lastCommitAt:
          type: [string, 'null']
        lastCommitSubject:
          type: [string, 'null']
        checkout:
          type: string
        dirtyFiles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, status]
            properties:
              path:
                type: string
              status:
                type: string

    ProjectBranchCommit:
      type: object
      additionalProperties: false
      required: [sha, subject, author, at]
      properties:
        sha:
          type: string
        subject:
          type: string
        author:
          type: string
        at:
          type: string

    ProjectBranchCompareFile:
      type: object
      additionalProperties: false
      required: [path, inA, inB, conflict]
      properties:
        path:
          type: string
        inA:
          type: boolean
        inB:
          type: boolean
        conflict:
          type: boolean

    ProjectBranchCompareConflict:
      type: object
      additionalProperties: false
      required: [file, hunks]
      properties:
        file:
          type: string
        hunks:
          type: array
          items:
            $ref: '#/components/schemas/ProjectBranchConflictHunk'

    ProjectBranchConflictHunk:
      type: object
      additionalProperties: false
      required: [line, ours, theirs]
      properties:
        line:
          type: integer
          minimum: 1
        ours:
          type: string
        theirs:
          type: string

    ProjectDiffFile:
      type: object
      additionalProperties: false
      required: [path, status, additions, deletions, author, hunks]
      properties:
        path:
          type: string
          minLength: 1
        oldPath:
          type: string
        status:
          type: string
          enum: [added, modified, deleted, renamed, copied, binary]
        additions:
          type: integer
          minimum: 0
        deletions:
          type: integer
          minimum: 0
        author:
          type: string
        hunks:
          type: array
          items:
            $ref: '#/components/schemas/ProjectDiffHunk'

    ProjectDiffHunk:
      type: object
      additionalProperties: false
      required: [header, content]
      properties:
        header:
          type: string
        content:
          type: string
          description: Unified diff hunk lines, including +/- status markers.

    ProjectSettingField:
      type: string
      enum: [engineLeader, engineJudge, engineWorker, claudeModelLeader, claudeModelJudge, maxParallel, maxPerRepo, maxClaudeRuns, maxAgyRuns, worktreePrepare]

    ProjectSettingValue:
      anyOf:
        - $ref: '#/components/schemas/ProjectEngine'
        - type: string
          minLength: 1
          maxLength: 256
        - type: integer
          minimum: 1
          maximum: 24
        - type: integer
          minimum: 1
          maximum: 8
        - $ref: '#/components/schemas/ProjectPrepareScript'

    ProjectEngine:
      type: string
      enum: [omp, claude, agy]


    ProjectSettingsValues:
      type: object
      additionalProperties: false
      properties:
        engineLeader:
          type: string
          enum: [omp, claude, agy]
        engineJudge:
          type: string
          enum: [omp, claude, agy]
        engineWorker:
          type: string
          enum: [omp, claude, agy]
        claudeModelLeader:
          type: string
          minLength: 1
          maxLength: 256
        claudeModelJudge:
          type: string
          minLength: 1
          maxLength: 256
        maxParallel:
          type: integer
          minimum: 1
          maximum: 24
        maxPerRepo:
          type: integer
          minimum: 1
          maximum: 8
        maxClaudeRuns:
          type: integer
          minimum: 1
          maximum: 4
        maxAgyRuns:
          type: integer
          minimum: 1
          maximum: 4
        worktreePrepare:
          $ref: '#/components/schemas/ProjectPrepareScript'

    ProjectPrepareScript:
      type: object
      additionalProperties: false
      required: [argv, timeoutMs]
      properties:
        argv:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 4096
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 3600000

    ProjectSettingsSources:
      type: object
      additionalProperties: false
      properties:
        engineLeader:
          type: string
          enum: [global, project, folder]
        engineJudge:
          type: string
          enum: [global, project, folder]
        engineWorker:
          type: string
          enum: [global, project, folder]
        claudeModelLeader:
          type: string
          enum: [global, project, folder]
        claudeModelJudge:
          type: string
          enum: [global, project, folder]
        maxParallel:
          type: string
          enum: [global, project, folder]
        maxPerRepo:
          type: string
          enum: [global, project, folder]
        maxClaudeRuns:
          type: string
          enum: [global, project, folder]
        maxAgyRuns:
          type: string
          enum: [global, project, folder]
        worktreePrepare:
          type: string
          enum: [global, project, folder]
