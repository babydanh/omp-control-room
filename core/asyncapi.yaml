    UsageHistoryRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, days]
      properties:
        type:
          const: usageHistoryRequest
        requestId:
          type: string
          format: uuid
        days:
          type: integer
          enum: [1, 7, 30]
        force:
          type: boolean
          description: Read OMP again instead of answering from the server's cache.

    UsageStatsRequestMessage:
      type: object
      additionalProperties: false
      required: [type, requestId]
      properties:
        type:
          const: usageStatsRequest
        requestId:
          type: string
          format: uuid
        force:
          type: boolean
          description: Read OMP again instead of answering from the server's cache.

    UsageLimitsMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, generatedAt, status, cached, snapshots, capacity]
      properties:
        type:
          const: usageLimits
        requestId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
          description: When the read that produced these numbers ran. A cached reply keeps its original time.
        status:
          type: string
          enum: [available, unsupported, unauthenticated, error]
          description: Outcome of the last real read. With `error`, the snapshots are the previous ones, marked stale.
        message:
          type: string
          description: Redacted diagnostic, present for any status other than available.
        cached:
          type: boolean
          description: True when this reply reused an earlier read, so no process ran for it.
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/QuotaSnapshot'
        capacity:
          type: array
          items:
            $ref: '#/components/schemas/QuotaCapacityRow'

    UsageHistoryMessage:
      type: object
      additionalProperties: false
      required: [type, requestId, generatedAt, sinceAt, days, entries, clients]
      properties:
        type:
          const: usageHistory
        requestId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        sinceAt:
          type: string
          format: date-time
          description: Start of the window the history covers.
        days:
          type: integer
          minimum: 1
        entries:
          type: array
          items:
            $ref: '#/components/schemas/UsageHistoryEntry'
        clients:
          type: array
          description: Per-client burn; empty when OMP reports no client for the window.
          items:
            $ref: '#/components/schemas/UsageClientBurn'

